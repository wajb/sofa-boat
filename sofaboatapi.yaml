openapi: 3.0.3
info:
  title: Sofa Boat API
  version: 1.0.0
  description: API for retrieving sofa boat data
servers:
  - url: https://api.example.com/v1
paths:
  /sofaboats:
    get:
      summary: Get list of sofa boats
      description: Retrieve a list of all available sofa boats.
      responses:
        '200':
          description: A JSON array of sofa boats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SofaBoat'

components:
  schemas:
    SofaBoat:
      type: object
      properties:
        id:
          type: string
          example: "sb-001"
        name:
          type: string
          example: "Luxury Sofa Boat"
        capacity:
          type: integer
          example: 6
        color:
          type: string
          example: "blue"